---
# ============================================================
# cPanel Git Version Control — Auto-Deploy Config
# Repo path on server: /home/z4sww4p4xieh/public_html/ppost.emdatra.org
# Triggered on every "Update from Remote" + "Deploy HEAD Commit".
# ============================================================
deployment:
  tasks:
    - export PHP=/opt/alt/php84/usr/bin/php
    - echo "================================================"
    - echo "  ppost deployment started @ $(date)"
    - echo "================================================"

    # 1. Permissions (Laravel needs write access)
    - /bin/chmod -R 755 storage bootstrap/cache 2>/dev/null || true

    # 2. Composer install if vendor missing or composer.lock changed
    - if [ ! -d vendor ] || [ composer.lock -nt vendor ]; then $PHP /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction 2>&1 || true; fi

    # 3. Run pending migrations (commented out — uncomment when ready for auto-migrations)
    # - $PHP artisan migrate --force 2>&1 || true

    # 4. Clear all Laravel caches
    - $PHP artisan view:clear 2>&1 || true
    - $PHP artisan config:clear 2>&1 || true
    - $PHP artisan cache:clear 2>&1 || true
    - $PHP artisan route:clear 2>&1 || true

    # 5. Rebuild optimized caches for production
    - $PHP artisan config:cache 2>&1 || true
    - $PHP artisan route:cache 2>&1 || true
    - $PHP artisan view:cache 2>&1 || true

    # 6. Clear custom StaticPageRenderer cache
    - /bin/rm -rf storage/framework/cache/pages/*.html 2>/dev/null || true

    # 7. Storage symlink (idempotent)
    - $PHP artisan storage:link 2>&1 || true

    - echo "================================================"
    - echo "  ppost deployment completed @ $(date)"
    - echo "================================================"
